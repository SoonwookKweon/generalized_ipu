[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generalized-ipu"
version = "0.1.0.dev0"
description = "다계층, 구간 목표, 다차원 교차표, 범주 위계를 수용하는 범용 IPU 라이브러리"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Soonwook Kweon" }]
keywords = ["ipu", "population-synthesis", "reweighting", "microsimulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7"]
examples = ["jupyterlab>=4", "nbformat>=5"]

[project.urls]
Repository = "https://github.com/SoonwookKweon/generalized_ipu"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
